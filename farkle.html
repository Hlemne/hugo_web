<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no"
    >

    <title>Farkle – Spelare</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/farkle.css">
</head>

<body>
    <div class="container">
        <div class="farkle-start-card">
            <h1>Farkle</h1>

            <p class="farkle-description">
                Lägg till spelarna och starta poängräkningen.
            </p>

            <label for="playerCount">Antal spelare</label>

            <select id="playerCount" onchange="createPlayerInputs()">
                <option value="2">2 spelare</option>
                <option value="3">3 spelare</option>
                <option value="4">4 spelare</option>
                <option value="5">5 spelare</option>
                <option value="6">6 spelare</option>
                <option value="7">7 spelare</option>
                <option value="8">8 spelare</option>
            </select>

            <div id="playerInputs" class="player-inputs"></div>

            <button class="btn green start-button" onclick="startFarkle()">
                Starta spelet
            </button>

            <a href="index.html" class="btn red back-button">
                Tillbaka
            </a>
        </div>
    </div>

    <script>
        function createPlayerInputs() {
            const playerCount =
                Number(document.getElementById('playerCount').value);

            const playerInputs =
                document.getElementById('playerInputs');

            playerInputs.innerHTML = '';

            for (let i = 1; i <= playerCount; i++) {
                const input = document.createElement('input');

                input.type = 'text';
                input.id = `player${i}`;
                input.placeholder = `Spelare ${i}`;
                input.maxLength = 20;

                playerInputs.appendChild(input);
            }
        }

        function startFarkle() {
            const playerCount =
                Number(document.getElementById('playerCount').value);

            const players = [];

            for (let i = 1; i <= playerCount; i++) {
                const enteredName =
                    document.getElementById(`player${i}`).value.trim();

                players.push(
                    enteredName || `Spelare ${i}`
                );
            }

            localStorage.setItem(
                'farklePlayers',
                JSON.stringify(players)
            );

            localStorage.removeItem('farkleGameState');

            window.location.href = 'farkle-score.html';
        }

        createPlayerInputs();
    </script>
</body>
</html>
